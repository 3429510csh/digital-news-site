<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数码前线 — 文章详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Markdown 解析器 -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#0a0e1a] text-gray-200 min-h-screen">

  <!-- 导航栏 -->
  <nav id="navbar"></nav>

  <!-- 文章内容 -->
  <article class="max-w-3xl mx-auto px-4 py-8">
    <!-- 返回按钮 -->
    <a href="javascript:history.back()" class="inline-flex items-center gap-2 text-gray-400 hover:text-cyan-400 text-sm mb-6 transition-colors">
      ← 返回列表
    </a>

    <!-- 加载中 -->
    <div id="loading" class="text-center py-20">
      <div class="inline-block w-10 h-10 border-4 border-gray-700 border-t-cyan-400 rounded-full animate-spin"></div>
      <p class="text-gray-400 mt-4">加载中...</p>
    </div>

    <!-- 文章正文 -->
    <div id="article-content" class="hidden">
      <!-- 分类标签 -->
      <div id="article-category" class="inline-block px-3 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-sm mb-4"></div>

      <!-- 标题 -->
      <h1 id="article-title" class="text-3xl md:text-4xl font-bold text-white leading-tight mb-4"></h1>

      <!-- 元信息 -->
      <div class="flex flex-wrap items-center gap-4 text-sm text-gray-400 mb-8 pb-6 border-b border-white/5">
        <span class="flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/></svg>
          <span id="article-author"></span>
        </span>
        <span class="flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
          <span id="article-date"></span>
        </span>
        <span class="flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg>
          <span id="article-views"></span> 阅读
        </span>
      </div>

      <!-- 封面图 -->
      <img id="article-cover" class="w-full rounded-xl mb-8 border border-white/5" alt="封面图">

      <!-- 正文内容（Markdown 渲染） -->
      <div id="article-body" class="prose-content"></div>

      <!-- 底部操作 -->
      <div class="mt-12 pt-8 border-t border-white/5 flex flex-wrap items-center justify-between gap-4">
        <a href="/tutorials.html" class="text-cyan-400 hover:text-cyan-300 text-sm">← 返回教程列表</a>
        <a href="/feedback.html" class="px-6 py-2 rounded-lg border border-gray-600 hover:border-cyan-400 text-gray-200 hover:text-cyan-400 text-sm transition-all">
          留言反馈
        </a>
      </div>
    </div>

    <!-- 文章不存在 -->
    <div id="not-found" class="hidden text-center py-20">
      <div class="text-6xl mb-4">🔍</div>
      <p class="text-gray-400 text-lg mb-2">文章不存在</p>
      <a href="/tutorials.html" class="text-cyan-400 hover:text-cyan-300 text-sm">返回列表 →</a>
    </div>
  </article>

  <!-- 页脚 -->
  <footer class="border-t border-white/5 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
      <p>数码前线 Digital Frontier — 仅用于本地测试</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/article-detail.js"></script>
</body>
</html>
