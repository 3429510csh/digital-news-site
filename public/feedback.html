<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数码前线 — 留言反馈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#0a0e1a] text-gray-200 min-h-screen">

  <!-- 导航栏 -->
  <nav id="navbar"></nav>

  <section class="max-w-2xl mx-auto px-4 py-12">
    <!-- 标题 -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-sm mb-4">
        💬 留言反馈
      </div>
      <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">我们重视你的声音</h1>
      <p class="text-gray-400">有任何建议、问题或合作意向？欢迎留言告诉我们</p>
    </div>

    <!-- 留言表单 -->
    <div class="bg-[#141b2d] rounded-2xl p-6 md:p-8 border border-white/5">
      <form id="feedback-form" class="space-y-5">
        <!-- 姓名 -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            姓名 <span class="text-red-400">*</span>
          </label>
          <input
            type="text"
            id="name"
            name="name"
            maxlength="50"
            required
            placeholder="请输入你的姓名"
            class="w-full px-4 py-3 rounded-lg bg-[#0a0e1a] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
          >
        </div>

        <!-- 邮箱 -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            邮箱 <span class="text-gray-500 text-xs">(选填)</span>
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="your@email.com"
            class="w-full px-4 py-3 rounded-lg bg-[#0a0e1a] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors"
          >
        </div>

        <!-- 留言内容 -->
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">
            留言内容 <span class="text-red-400">*</span>
            <span class="text-gray-500 text-xs float-right">
              <span id="char-count">0</span> / 1000
            </span>
          </label>
          <textarea
            id="message"
            name="message"
            rows="6"
            maxlength="1000"
            required
            placeholder="请输入你的留言或建议..."
            class="w-full px-4 py-3 rounded-lg bg-[#0a0e1a] border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-colors resize-none"
          ></textarea>
        </div>

        <!-- 提交按钮 -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full py-3 rounded-lg bg-cyan-500 hover:bg-cyan-400 text-white font-medium transition-all hover:shadow-lg hover:shadow-cyan-500/30 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          提交留言
        </button>
      </form>

      <!-- 成功提示 -->
      <div id="success-message" class="hidden text-center py-8">
        <div class="text-5xl mb-4">✅</div>
        <p class="text-green-400 text-lg font-medium mb-2">留言提交成功！</p>
        <p class="text-gray-400 text-sm mb-6">感谢你的反馈，我们会认真阅读每一条留言</p>
        <button id="reset-btn" class="px-6 py-2 rounded-lg border border-gray-600 hover:border-cyan-400 text-gray-200 hover:text-cyan-400 text-sm transition-all">
          再写一条
        </button>
      </div>

      <!-- 错误提示 -->
      <div id="error-message" class="hidden mt-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
      </div>
    </div>

    <!-- 说明 -->
    <div class="mt-6 text-center text-gray-500 text-sm">
      <p>你的留言将存储在本地数据库中，管理员可在后台查看</p>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="border-t border-white/5 mt-12">
    <div class="max-w-6xl mx-auto px-4 py-8 text-center text-gray-500 text-sm">
      <p>数码前线 Digital Frontier — 仅用于本地测试</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script src="/js/feedback.js"></script>
</body>
</html>
